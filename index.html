<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lightbox Trace</title>
<style>
  :root{
    --bg:#eaf4fc;
    --panel:#dbecfa;
    --panel-line:#b9d7ee;
    --accent:#7fb4e3;
    --accent-locked:#f0a8b6;
    --text:#20303f;
    --text-dim:#5f7488;
    --mono: 'SF Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
    color:var(--text);
    touch-action:none;
    overscroll-behavior:none;
  }

  /* ---------- STAGE (light-box surface) ---------- */
  #stage{
    position:fixed; inset:0;
    background:#f6fafd;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #imgWrap{
    position:absolute;
    left:50%; top:50%;
    will-change:transform;
    touch-action:none;
  }
  #img{
    display:none;
    max-width:none;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  #emptyState{
    text-align:center;
    color:#7c93a8;
    pointer-events:none;
  }
  #emptyState .mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#6d879e;
    margin-bottom:10px;
  }
  #emptyState .msg{ font-size:15px; color:#89a0b5; }

  /* ---------- STARTUP NOTICE ---------- */
  #startupNotice{
    position:fixed; inset:0;
    z-index:80;
    background:rgba(16,28,40,.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  #startupNotice.hidden{ display:none; }
  #startupCard{
    width:100%; max-width:420px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:26px 24px;
  }
  #startupMark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  #startupText{
    margin:0 0 20px;
    font-size:14px;
    line-height:1.8;
    color:var(--text);
  }
  #startupClose{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#12324c;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- LOCK OVERLAY ---------- */
  #lockCatcher{
    position:fixed; inset:0;
    z-index:40;
    display:none;
    touch-action:none;
  }
  body.locked #lockCatcher{ display:block; }

  /* ---------- PIN BUTTON ---------- */
  #pinBtn{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    z-index:50;
    width:56px; height:56px;
    border-radius:50%;
    border:2px solid var(--panel-line);
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  #pinBtn:active{ transform:scale(.92); }
  #pinBtn svg{ width:24px; height:24px; }
  body.locked #pinBtn{
    background:var(--accent-locked);
    border-color:#e0879a;
  }
  #pinLabel{
    position:fixed;
    top:calc(76px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    z-index:50;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    color:var(--text-dim);
    text-transform:uppercase;
    pointer-events:none;
  }

  /* ---------- CONTROL PANEL ---------- */
  #panel{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:45;
    background:var(--panel);
    border-top:1px solid var(--panel-line);
    padding:22px 20px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(0);
    transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .28s ease;
  }
  body.locked #panel{
    transform:translateY(120%);
    opacity:0;
    pointer-events:none;
  }
  #panelInner{
    max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; gap:16px;
  }
  .row{ display:flex; align-items:center; gap:14px; }
  .row-label{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    width:52px;
    flex-shrink:0;
  }
  .row-value{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    width:38px;
    text-align:right;
    flex-shrink:0;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:2px;
    background:var(--panel-line);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--accent);
    border:2px solid var(--panel-line);
    margin-top:0;
  }

  #pickBtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--text);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  #pickBtn svg{ width:16px; height:16px; opacity:.8; }
  #fileInput{ display:none; }

  .actionsRow{
    display:flex;
    align-items:stretch;
    gap:14px;
  }
  .actionsRow #pickBtn{ flex:1; }
  #embroideryLink{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:84px;
    padding:8px 6px;
    border-radius:10px;
    border:1px solid var(--panel-line);
    background:var(--panel);
    text-decoration:none;
    cursor:pointer;
  }
  #embroideryLink img{
    width:44px; height:44px;
    border-radius:8px;
    object-fit:cover;
    display:block;
  }
  #embroideryLink span{
    font-size:9.5px;
    line-height:1.3;
    color:var(--text-dim);
    text-align:center;
    letter-spacing:.01em;
  }

  #hint{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.02em;
  }
</style>
</head>
<body>

  <div id="stage">
    <div id="emptyState">
      <div class="mark">LIGHTBOX TRACE</div>
      <div class="msg">画像を選んでください</div>
    </div>
    <div id="imgWrap">
      <img id="img" alt="">
    </div>
  </div>

  <div id="lockCatcher"></div>

  <div id="startupNotice">
    <div id="startupCard">

        画面上端からコントロールセンターを開き、明るさスライダーを一番上まで上げると見やすくなります。
      </p>
      <button id="startupClose">はじめる</button>
    </div>
  </div>

      <div id="hint">指1本で移動、指2本のピンチで大きさを調整できます。固定ボタンで操作をロックできます。</div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*">

<script>
(function(){
  const stage = document.getElementById('stage');
  const imgWrap = document.getElementById('imgWrap');
  const img = document.getElementById('img');
  const emptyState = document.getElementById('emptyState');
  const pinBtn = document.getElementById('pinBtn');
  const fileInput = document.getElementById('fileInput');
  const pickBtn = document.getElementById('pickBtn');
  const startupNotice = document.getElementById('startupNotice');
  const startupClose = document.getElementById('startupClose');

  startupClose.addEventListener('click', () => {
    startupNotice.classList.add('hidden');
  });

  const MIN_SCALE = 0.1;
  const MAX_SCALE = 4.0;

  let state = {
    scale: 1,
    x: 0,
    y: 0,
    naturalW: 0,
    naturalH: 0,
    locked: false
  };

  function applyTransform(){
    imgWrap.style.transform =
      `translate(-50%, -50%) translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
  }

  // ---------- image loading ----------
  pickBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => {
        state.naturalW = img.naturalWidth;
        state.naturalH = img.naturalHeight;
        state.scale = Math.min(
          (stage.clientWidth * 0.85) / state.naturalW,
          (stage.clientHeight * 0.85) / state.naturalH,
          1
        );
        state.x = 0; state.y = 0;
        img.style.display = 'block';
        emptyState.style.display = 'none';
        applyTransform();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ---------- drag (1本指で移動) / pinch (2本指で大きさ調整) ----------
  const activePointers = new Map();
  let dragging = false;
  let startPX = 0, startPY = 0, startX = 0, startY = 0;
  let pinchStartDist = 0, pinchStartScale = 1;

  function minScale(){ return MIN_SCALE; }
  function maxScale(){ return MAX_SCALE; }

  function distanceBetween(p1, p2){
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  stage.addEventListener('pointerdown', (e) => {
    if(state.locked || img.style.display === 'none') return;
    stage.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(activePointers.size === 1){
      dragging = true;
      startPX = e.clientX; startPY = e.clientY;
      startX = state.x; startY = state.y;
    } else if(activePointers.size === 2){
      dragging = false;
      const pts = Array.from(activePointers.values());
      pinchStartDist = distanceBetween(pts[0], pts[1]);
      pinchStartScale = state.scale;
    }
  });

  stage.addEventListener('pointermove', (e) => {
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(activePointers.size === 2){
      const pts = Array.from(activePointers.values());
      const dist = distanceBetween(pts[0], pts[1]);
      if(pinchStartDist > 0){
        let next = pinchStartScale * (dist / pinchStartDist);
        next = Math.max(minScale(), Math.min(maxScale(), next));
        state.scale = next;
        applyTransform();
      }
    } else if(activePointers.size === 1 && dragging){
      state.x = startX + (e.clientX - startPX);
      state.y = startY + (e.clientY - startPY);
      applyTransform();
    }
  });

  function releasePointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size === 1){
      const remaining = Array.from(activePointers.entries())[0];
      dragging = true;
      startPX = remaining[1].x; startPY = remaining[1].y;
      startX = state.x; startY = state.y;
    } else {
      dragging = false;
    }
  }

  stage.addEventListener('pointerup', releasePointer);
  stage.addEventListener('pointercancel', releasePointer);

  // ---------- pin / lock ----------
  pinBtn.addEventListener('click', () => {
    state.locked = !state.locked;
    document.body.classList.toggle('locked', state.locked);
  });

})();
</script>
</body>
</html>
